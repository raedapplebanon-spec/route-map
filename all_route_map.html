<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>All Routes Admin Map</title>
  <style>
    /* ✅ 1. Layout Settings */
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: "Segoe UI", Tahoma, sans-serif; }
    #map { height: 100%; width: 100%; }

    /* ✅ 2. Search Box */
    #pac-input { display: none; background-color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 14px; font-weight: 500; margin-top: 10px; margin-left: 10px; padding: 0 12px; width: 280px; height: 40px; border-radius: 8px; border: 1px solid #ddd; box-shadow: 0 4px 6px rgba(0,0,0,0.15); outline: none; direction: rtl; }

    /* ✅ 3. Legend */
    #legend { display: none; background: rgba(255, 255, 255, 0.95); margin: 12px; padding: 12px 16px; border-radius: 8px; font-size: 13px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); max-height: 300px; overflow-y: auto; direction: rtl; min-width: 160px; border: 1px solid #eee; }
    .legend-header { font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #ddd; padding-bottom: 6px; color: #333; }
    .legend-item { display: flex; align-items: center; margin-bottom: 6px; padding: 2px 0; }
    .color-box { width: 14px; height: 14px; margin-left: 8px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); }
  </style>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCYaJ4Gjq36mq8swYgjNXOYr5mKZi45niA&libraries=places,marker&callback=initMap&loading=async&v=weekly" async defer></script>
</head>
<body>

  <input id="pac-input" class="controls" type="text" placeholder="بحث عن طالب أو موقع..." />
  <div id="legend"></div>
  <div id="map"></div>

  <script>
    let map, infoWindow;
    let mapReady = false;
    let lastPayloadString = ""; // 🔒 Prevents duplicate Directions API billing
    let pendingData = null;     // 🔒 Holds data if sent before map finishes loading
    
    window.activeRoutes = []; 
    window.availableMarkers = [];

    const COLORS = [
      "#D50000", "#2962FF", "#00C853", "#FF6D00", "#AA00FF", 
      "#00B8D4", "#C51162", "#3E2723", "#2E7D32", "#304FFE"
    ];

    // 🔒 SECURITY FIX: Sanitize strings before inserting into HTML
    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function haversineDistance(lat1, lng1, lat2, lng2) {
      const R = 6371e3;
      const toRad = x => x * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function groupCloseLocations(stops, tolerance = 15) {
      const clusters = [];
      stops.forEach(stop => {
        let placed = false;
        const rawType = stop.stopType || stop.stop_type || "";
        const type = rawType.toLowerCase().trim();
        const shift = (stop.timeShift || "").toUpperCase().trim();
        const sLat = parseFloat(stop.lat);
        const sLng = parseFloat(stop.lng);
        
        const rawOrder = (stop.stop_order !== undefined) ? stop.stop_order : stop.stopOrder;
        const stopOrderVal = (rawOrder !== undefined && rawOrder !== null) ? parseInt(rawOrder) : 0;

        for (const c of clusters) {
          const d = haversineDistance(c.lat, c.lng, sLat, sLng);
          if (d < tolerance) {
            c.items.push(stop);
            if (stop.isStart === true || stop.is_start_stop === true) c.isStart = true;
            if (stop.isFinal === true || stop.is_end_stop === true) c.isFinal = true;
            
            if (type === 'assistant') {
              c.stopType = 'assistant';
              if (shift) c.timeShift = shift;
            }
            c.hideMarker = c.hideMarker && (stop.hideMarker === true || stop.hideMarker === 'true');
            
            if (stopOrderVal > 0) {
              if (!c.minOrder || stopOrderVal < c.minOrder) c.minOrder = stopOrderVal;
            }
            placed = true;
            break;
          }
        }
        if (!placed) {
          clusters.push({
            lat: sLat, lng: sLng,
            items: [stop],
            isStart: (stop.isStart === true || stop.is_start_stop === true),
            isFinal: (stop.isFinal === true || stop.is_end_stop === true),
            stopType: type,
            timeShift: shift,
            hideMarker: (stop.hideMarker === true || stop.hideMarker === 'true'),
            minOrder: (stopOrderVal > 0) ? stopOrderVal : 9999
          });
        }
      });
      return clusters;
    }

    // Listen for messages immediately, even before mapReady
    window.addEventListener("message", handleMessage);

    window.initMap = async function() {
      const { Map } = await google.maps.importLibrary("maps");
      await google.maps.importLibrary("marker");

      infoWindow = new google.maps.InfoWindow();

      map = new Map(document.getElementById("map"), {
        center: { lat: 32.028031, lng: 35.704308 },
        zoom: 13,
        mapTypeControl: true, streetViewControl: false, fullscreenControl: false,
        mapId: "48c2bb983bd19c1c44d95cb7" 
      });

      const input = document.getElementById("pac-input");
      const legend = document.getElementById("legend");
      
      const autocomplete = new google.maps.places.Autocomplete(input);
      autocomplete.bindTo("bounds", map);
      
      map.controls[google.maps.ControlPosition.TOP_LEFT].push(input);
      map.controls[google.maps.ControlPosition.RIGHT_BOTTOM].push(legend);

      google.maps.event.addListenerOnce(map, 'tilesloaded', () => {
         input.style.display = "block"; 
      });

      mapReady = true;
      console.log("✅ Map Initialized");

      // Process any message that arrived before map finished loading
      if (pendingData) {
        processRoutePayload(pendingData);
        pendingData = null;
      }
    };

    function handleMessage(event) {
      if (!event.data) return;
      let data = event.data;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch(e) { return; }
      }
      
      if (data.action === "setRouteData") {
        const currentPayloadString = JSON.stringify(data);
        // 🔒 Ignore duplicate retry messages if the data is identical
        if (currentPayloadString === lastPayloadString && mapReady) {
          return;
        }
        if (!mapReady) {
          pendingData = data;
          return;
        }
        lastPayloadString = currentPayloadString;
        processRoutePayload(data);
      }
    }

    function processRoutePayload(data) {
      if (data.routesGrouped && data.routesGrouped.length > 0) {
        renderAllRoutes(data.routesGrouped, data.availableData);
      } else if (data.routeData && data.routeData.length > 0) {
        const fakeGroup = [{ routeId: "default", points: data.routeData }];
        renderAllRoutes(fakeGroup, data.availableData);
      } else {
        renderAllRoutes([], data.availableData);
      }
    }

    async function renderAllRoutes(groupedRoutes, availableData) {
      if (!mapReady) return;

      window.activeRoutes.forEach(r => {
        r.renderer.setMap(null);
        r.markers.forEach(m => m.map = null);
      });
      window.activeRoutes = [];
      window.availableMarkers.forEach(m => m.map = null);
      window.availableMarkers = [];

      const legend = document.getElementById("legend");
      const count = groupedRoutes ? groupedRoutes.length : 0;
      const bounds = new google.maps.LatLngBounds();

      if (count > 0) {
        legend.innerHTML = `<div class="legend-header">تم استلام: ${count} جولات</div>`;
        legend.style.display = "block";
        
        let i = 0;
        for (const group of groupedRoutes) {
          const color = COLORS[i % COLORS.length];
          const routeId = escapeHtml(group.routeId || "Unknown");
          const points = group.points;

          legend.innerHTML += `
            <div class="legend-item">
              <div class="color-box" style="background:${color}"></div>
              <span>جولة: ${routeId}</span>
            </div>
          `;

          await processSingleRoute(routeId, points, color, bounds);
          i++;
        }
      } else {
        legend.style.display = "none";
      }

      if (availableData && availableData.length > 0) {
        renderAvailableStudents(availableData, bounds);
      }

      if (!bounds.isEmpty()) {
        map.fitBounds(bounds);
      }
    }

    function processSingleRoute(routeId, rawPoints, color, bounds) {
      return new Promise((resolve) => {
        const clusters = groupCloseLocations(rawPoints);
        
        const dService = new google.maps.DirectionsService();
        const dRenderer = new google.maps.DirectionsRenderer({
          map: map, suppressMarkers: true, preserveViewport: true,
          polylineOptions: { strokeColor: color, strokeOpacity: 0.8, strokeWeight: 6 }
        });

        const routeObj = { renderer: dRenderer, markers: [], routeId: routeId };
        window.activeRoutes.push(routeObj);

        clusters.forEach(cluster => {
          if (cluster.hideMarker) return;
          const pos = { lat: cluster.lat, lng: cluster.lng };
          bounds.extend(pos);

          let pinText = "..."; 
          let pinHeader = "نقطة توقف";
          let borderColor = color;

          if (cluster.stopType === 'assistant') {
            pinText = cluster.timeShift === 'AM' ? "A" : "P";
            pinHeader = "المساعد (" + escapeHtml(cluster.timeShift) + ")";
            borderColor = "#000";
          } 
          else if (cluster.isStart) {
            pinText = "S"; pinHeader = "نقطة البداية"; borderColor = "#000";
          } 
          else if (cluster.isFinal) {
            pinText = "E"; pinHeader = "نقطة النهاية"; borderColor = "#000";
          }

          const html = buildInfoWindowHtml(cluster, pinHeader, color);
          const marker = createAdvancedMarker(pos, color, pinText, html, borderColor);
          routeObj.markers.push(marker);
        });

        const startPoint = clusters.find(c => c.isStart);
        const endPoint = clusters.find(c => c.isFinal);

        if (!startPoint || !endPoint) { resolve(); return; }

        let middleStops = clusters.filter(c => c !== startPoint && c !== endPoint);

        middleStops.sort((a, b) => {
            const orderA = a.minOrder || 9999;
            const orderB = b.minOrder || 9999;
            return orderA - orderB;
        });

        drawFinalPolyline(dService, dRenderer, startPoint, endPoint, middleStops, routeObj, resolve);
      });
    }

    function drawFinalPolyline(service, renderer, start, end, orderedStops, routeObj, onComplete) {
      const waypoints = orderedStops.map(s => ({ location: { lat: s.lat, lng: s.lng }, stopover: true }));

      service.route({
        origin: { lat: start.lat, lng: start.lng },
        destination: { lat: end.lat, lng: end.lng },
        waypoints: waypoints,
        travelMode: google.maps.TravelMode.DRIVING,
        optimizeWaypoints: false,
      }, (result, status) => {
        if (status === "OK") {
          renderer.setDirections(result);

          let counter = 1;
          orderedStops.forEach((stopCluster) => {
              const isAssistant = stopCluster.stopType === 'assistant';
              if (!isAssistant) {
                  const m = routeObj.markers.find(mark => 
                    Math.abs(mark.position.lat - stopCluster.lat) < 0.0001 && 
                    Math.abs(mark.position.lng - stopCluster.lng) < 0.0001
                  );
                  
                  if (m && m.content) {
                      m.content.glyphText = counter.toString();
                      counter++;
                  }
              }
          });
        }
        onComplete();
      });
    }

    function renderAvailableStudents(points, bounds) {
      const clusters = groupCloseLocations(points);
      const color = "#9E9E9E";
      clusters.forEach(cluster => {
        const pos = { lat: cluster.lat, lng: cluster.lng };
        bounds.extend(pos);
        const html = buildInfoWindowHtml(cluster, "خارج الجولة", color);
        const marker = createAdvancedMarker(pos, color, cluster.items.length.toString(), html, "#333");
        window.availableMarkers.push(marker);
      });
    }

    function createAdvancedMarker(pos, color, text, html, borderColor = "#FFF") {
      const pin = new google.maps.marker.PinElement({
        background: color,
        borderColor: borderColor,
        glyphColor: "#FFFFFF",
        glyphText: text 
      });
      const marker = new google.maps.marker.AdvancedMarkerElement({
        map: map,
        position: pos,
        content: pin.element,
        gmpClickable: true
      });
      
      marker.addListener("click", () => {
        infoWindow.setContent(html);
        infoWindow.open(map, marker);
      });
      return marker;
    }

    function buildInfoWindowHtml(cluster, title, color) {
      let rows = cluster.items.map(x => {
        const name = escapeHtml(x.studentName || x.display_name || "مستخدم");
        const type = (x.stopType || x.stop_type || "").toLowerCase().trim();
        let details = "";
        
        if (type === 'employee') {
            details = "موظف";
        } else {
            const g = escapeHtml(x.gradeName || x.grade_name || "");
            const s = escapeHtml(x.sectionName || x.section_name || "");
            if (g || s) details = `${g} - ${s}`;
        }

        return `<div style="margin-bottom:6px; border-bottom:1px solid #eee; padding-bottom:4px;">
                  <b>${name}</b><br><span style="font-size:12px; color:#555;">${details}</span>
                </div>`;
      }).join('');
      
      return `<div style="color:black;text-align:right;direction:rtl;min-width:180px;">
                <b style="color:${color}; font-size:14px;">${escapeHtml(title)}</b><hr>${rows}
              </div>`;
    }
  </script>
</body>
</html>
